<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d'), bgc = $('bg');
const ui = { score:$('score'), combo:$('combo'), judge:$('judge'), lives:$('lives'), best:$('best'), lv:$('lv'), gfill:$('gfill'), glabel:$('glabel'), vig:$('vig') };
const TAU = Math.PI*2;
const store = { get(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} } };

let lite = store.get('dopatap_lite', (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) ? '1':'0')==='1';
$('liteChk').checked = lite;
$('liteChk').addEventListener('change', e => { lite = e.target.checked; store.set('dopatap_lite', lite?'1':'0'); });
let muted = store.get('dopatap_mute','0')==='1';
$('muteBtn').textContent = muted?'🔇':'🔊';

let W, H, R, DPR;
// ================= WebGL shader background =================
const gl = (() => { try { return bgc.getContext('webgl', {antialias:false, alpha:false, powerPreference:'high-performance'}); } catch(e){ return null; } })();
let prog = null, U = {};
if (gl) {
  const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
  const fs = `
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 r; uniform float t,z0,beat,en,hue,fev;
vec3 pal(float x){return .5+.5*cos(6.2831*(x+vec3(0.,.33,.67)));}
void main(){
  vec2 p=(gl_FragCoord.xy*2.-r)/min(r.x,r.y);
  float l=length(p)+.001, a=atan(p.y,p.x);
  float d=.5/l;
  float ring=pow(.5+.5*sin((d+z0)*6.2831),6.);
  float ray=pow(.5+.5*sin(a*10.+sin(d*1.5+t)*1.5+t*.3),3.);
  float h=hue+.08*sin(d+t*.2)+fev*(a*.159+t*.4);
  vec3 c=pal(h)*ring*(.10+.35*en+.25*beat);
  c+=pal(h+.3)*ray*ring*(.05+.30*en);
  c+=pal(h+.55)*(.02+.10*beat+.08*en)/(l*l*3.+.3);
  c*=smoothstep(.05,.5,l)*.85+.15;
  c*=1.-.35*smoothstep(.8,1.8,l);
  c+=vec3(.02,.02,.05);
  gl_FragColor=vec4(c,1.);
}`;
  const mk = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return gl.getShaderParameter(s, gl.COMPILE_STATUS) ? s : null; };
  const a = mk(gl.VERTEX_SHADER, vs), b = mk(gl.FRAGMENT_SHADER, fs);
  if (a && b) {
    prog = gl.createProgram(); gl.attachShader(prog, a); gl.attachShader(prog, b); gl.linkProgram(prog);
    if (gl.getProgramParameter(prog, gl.LINK_STATUS)) {
      gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1,1,-1,-1,1,1,1]), gl.STATIC_DRAW);
      const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
      for (const n of ['r','t','z0','beat','en','hue','fev']) U[n] = gl.getUniformLocation(prog, n);
    } else prog = null;
  }
}
function resize(){
  DPR = Math.min(2, window.devicePixelRatio||1);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W*DPR; cv.height = H*DPR;
  const bs = Math.min(1.5, DPR); bgc.width = Math.floor(W*bs); bgc.height = Math.floor(H*bs);
  if (gl) gl.viewport(0,0,bgc.width,bgc.height);
  R = Math.min(W, H*0.62) * 0.36;
}
window.addEventListener('resize', resize); resize();

// ================= Audio engine (all synthesized) =================
let AC = null, master, musicBus, musicLP, fxBus, bassBus, rev, noiseBuf;
let calib = Math.max(-0.12, Math.min(0.2, +store.get('dopatap_calib', 0) || 0)); // auto-learned tap/audio offset (sec)
function initAudio(){
  if (AC) { if (AC.state==='suspended') AC.resume(); return; }
  const Ctor = window.AudioContext || window.webkitAudioContext; if (!Ctor) return;
  AC = new Ctor();
  const comp = AC.createDynamicsCompressor(); comp.threshold.value = -12; comp.knee.value = 6; comp.ratio.value = 8; comp.attack.value = 0.004; comp.release.value = 0.12; comp.connect(AC.destination);
  const shelf = AC.createBiquadFilter(); shelf.type = 'lowshelf'; shelf.frequency.value = 110; shelf.gain.value = 6; shelf.connect(comp);
  master = AC.createGain(); master.gain.value = muted?0:0.9; master.connect(shelf);
  // bass bus: soft saturation adds harmonics so the low end is felt even on small speakers
  const ws = AC.createWaveShaper(), curve = new Float32Array(1024);
  for (let i=0;i<1024;i++){ const x = i/511.5-1; curve[i] = Math.tanh(x*2.6); }
  ws.curve = curve; ws.oversample = '2x'; ws.connect(master);
  bassBus = AC.createGain(); bassBus.gain.value = 0.9; bassBus.connect(ws);
  // reverb impulse
  const len = Math.floor(AC.sampleRate*1.8), ir = AC.createBuffer(2, len, AC.sampleRate);
  for (let ch=0; ch<2; ch++){ const d = ir.getChannelData(ch); for (let i=0;i<len;i++) d[i] = (Math.random()*2-1)*Math.pow(1-i/len, 2.6); }
  rev = AC.createConvolver(); rev.buffer = ir; const rg = AC.createGain(); rg.gain.value = 0.3; rev.connect(rg); rg.connect(master);
  musicLP = AC.createBiquadFilter(); musicLP.type='lowpass'; musicLP.frequency.value = 700; musicLP.Q.value = 0.8; musicLP.connect(master);
  musicBus = AC.createGain(); musicBus.gain.value = 0.5; musicBus.connect(musicLP);
  fxBus = AC.createGain(); fxBus.gain.value = 0.8; fxBus.connect(master); fxBus.connect(rev);
  noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
}
function tone(bus, f, t, d, type, v, f2){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type||'sine'; o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(Math.max(20,f2), t+d);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t+0.006); g.gain.exponentialRampToValueAtTime(0.0001, t+d);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t+d+0.03);
}

S.last = performance.now();
